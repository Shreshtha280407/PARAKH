services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parakh
      POSTGRES_PASSWORD: parakh
      POSTGRES_DB: parakh
    ports:
      - "5432:5432"
    volumes:
      - parakh-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parakh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parakh-db:
