<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">PARAKH evidence integrity pipeline</title><desc id="desc">The phone captures, optimizes, hashes, signs and encrypts evidence offline. Resumable upload verifies the package. Evidence ECDSA signatures and final PDF Ed25519 signatures have separate roles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9844e"/></marker></defs><rect x="0" y="0" width="1400" height="700" rx="0" fill="#fbf6ec" stroke="#fbf6ec"/><text x="55" y="53" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">THE EVIDENCE PIPELINE</text><text x="55" y="107" fill="#482b1b" font-size="43" font-weight="normal" font-family="Georgia, serif">A capture becomes a protected, reviewable record.</text><text x="55" y="143" fill="#8c6c51" font-size="17" font-weight="normal" font-family="Arial, sans-serif">Integrity travels with the evidence, from local storage to the assessor workspace.</text><rect x="50" y="220" width="380" height="190" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="72" y="245" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">ON THE PHONE</text><text x="72" y="271" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Capture and prepare</text><text x="72" y="297" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">CameraX photo / video</text><text x="72" y="321" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Preview · retake · replace · delete</text><text x="72" y="345" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Media3 optimization to task budget</text><rect x="510" y="220" width="380" height="190" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="532" y="245" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">STILL OFFLINE</text><text x="532" y="271" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Bind and protect</text><text x="532" y="297" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Canonical manifest + SHA-256 hashes</text><text x="532" y="321" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Android Keystore ECDSA signature</text><text x="532" y="345" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Tink vault + durable Room outbox</text><rect x="970" y="220" width="380" height="190" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="992" y="245" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">WHEN CONNECTED</text><text x="992" y="271" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Resume and verify</text><text x="992" y="297" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">WorkManager streams 1 MiB chunks</text><text x="992" y="321" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Server checks manifest, hashes, quota</text><text x="992" y="345" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Finalize idempotently by revision</text><path d="M435 315 L502 315" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M895 315 L963 315" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="50" y="460" width="1300" height="140" rx="16" fill="#f0e2cb" stroke="#dfc9a9"/><text x="78" y="499" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">TWO DISTINCT SIGNATURES</text><text x="78" y="538" fill="#482b1b" font-size="23" font-weight="bold" font-family="Arial, sans-serif">Evidence package: ECDSA</text><text x="78" y="570" fill="#8c6c51" font-size="16" font-weight="normal" font-family="Arial, sans-serif">Binds a device-signed manifest to evidence hashes.</text><text x="740" y="538" fill="#482b1b" font-size="23" font-weight="bold" font-family="Arial, sans-serif">Final report: Ed25519</text><text x="740" y="570" fill="#8c6c51" font-size="16" font-weight="normal" font-family="Arial, sans-serif">Binds the server signature to the exact PDF digest.</text><text x="55" y="654" fill="#8c6c51" font-size="16" font-weight="normal" font-family="Arial, sans-serif">Encryption protects stored files. Signatures and hashes detect changes. Neither proves that a recorded skill was performed correctly.</text></svg>