<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Five PARAKH evidence tasks and their budgets</title><desc id="desc">Safety 15 MiB, tools and meter use 20 MiB, switchboard wiring 30 MiB, temporary lighting and fault 25 MiB, temporary LV panel 30 MiB. Total 120 MiB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9844e"/></marker></defs><rect x="0" y="0" width="1400" height="780" rx="0" fill="#fbf6ec" stroke="#fbf6ec"/><text x="55" y="53" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">PILOT TASK PACK / CON/Q0602 v4.0</text><text x="55" y="107" fill="#482b1b" font-size="43" font-weight="normal" font-family="Georgia, serif">Five practical tasks. A bounded evidence package.</text><text x="55" y="143" fill="#8c6c51" font-size="17" font-weight="normal" font-family="Arial, sans-serif">The 120 MiB limit applies to final optimized media; each task has its own allowance.</text><rect x="55" y="210" width="158.25" height="56" rx="0" fill="#b78b58" stroke="#b78b58"/><text x="69" y="245" fill="#fff9ee" font-size="16" font-weight="bold" font-family="Arial, sans-serif">T1 / 15 MiB</text><rect x="216.25" y="210" width="212.0" height="56" rx="0" fill="#9c7650" stroke="#9c7650"/><text x="230.25" y="245" fill="#fff9ee" font-size="16" font-weight="bold" font-family="Arial, sans-serif">T2 / 20 MiB</text><rect x="431.25" y="210" width="319.5" height="56" rx="0" fill="#755238" stroke="#755238"/><text x="445.25" y="245" fill="#fff9ee" font-size="16" font-weight="bold" font-family="Arial, sans-serif">T3 / 30 MiB</text><rect x="753.75" y="210" width="265.75" height="56" rx="0" fill="#b49b71" stroke="#b49b71"/><text x="767.75" y="245" fill="#fff9ee" font-size="16" font-weight="bold" font-family="Arial, sans-serif">T4 / 25 MiB</text><rect x="1022.5" y="210" width="319.5" height="56" rx="0" fill="#6c8062" stroke="#6c8062"/><text x="1036.5" y="245" fill="#fff9ee" font-size="16" font-weight="bold" font-family="Arial, sans-serif">T5 / 30 MiB</text><rect x="55" y="296" width="42" height="32" rx="7" fill="#b78b58" stroke="#b78b58"/><text x="63" y="319" fill="#fff9ee" font-size="14" font-weight="bold" font-family="Arial, sans-serif">T1</text><text x="120" y="319" fill="#482b1b" font-size="19" font-weight="normal" font-family="Arial, sans-serif">Safety and PPE</text><text x="1130" y="319" fill="#8c6c51" font-size="19" font-weight="normal" font-family="Arial, sans-serif">15 MiB</text><rect x="55" y="354" width="42" height="32" rx="7" fill="#9c7650" stroke="#9c7650"/><text x="63" y="377" fill="#fff9ee" font-size="14" font-weight="bold" font-family="Arial, sans-serif">T2</text><text x="120" y="377" fill="#482b1b" font-size="19" font-weight="normal" font-family="Arial, sans-serif">Tools and meter use</text><text x="1130" y="377" fill="#8c6c51" font-size="19" font-weight="normal" font-family="Arial, sans-serif">20 MiB</text><rect x="55" y="412" width="42" height="32" rx="7" fill="#755238" stroke="#755238"/><text x="63" y="435" fill="#fff9ee" font-size="14" font-weight="bold" font-family="Arial, sans-serif">T3</text><text x="120" y="435" fill="#482b1b" font-size="19" font-weight="normal" font-family="Arial, sans-serif">LV switchboard wiring</text><text x="1130" y="435" fill="#8c6c51" font-size="19" font-weight="normal" font-family="Arial, sans-serif">30 MiB</text><rect x="55" y="470" width="42" height="32" rx="7" fill="#b49b71" stroke="#b49b71"/><text x="63" y="493" fill="#fff9ee" font-size="14" font-weight="bold" font-family="Arial, sans-serif">T4</text><text x="120" y="493" fill="#482b1b" font-size="19" font-weight="normal" font-family="Arial, sans-serif">Temporary lighting / fault</text><text x="1130" y="493" fill="#8c6c51" font-size="19" font-weight="normal" font-family="Arial, sans-serif">25 MiB</text><rect x="55" y="528" width="42" height="32" rx="7" fill="#6c8062" stroke="#6c8062"/><text x="63" y="551" fill="#fff9ee" font-size="14" font-weight="bold" font-family="Arial, sans-serif">T5</text><text x="120" y="551" fill="#482b1b" font-size="19" font-weight="normal" font-family="Arial, sans-serif">Temporary LV panel</text><text x="1130" y="551" fill="#8c6c51" font-size="19" font-weight="normal" font-family="Arial, sans-serif">30 MiB</text><text x="55" y="653" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">TOTAL</text><text x="55" y="696" fill="#482b1b" font-size="32" font-weight="normal" font-family="Georgia, serif">120 MiB = 125,829,120 bytes</text><text x="55" y="735" fill="#8c6c51" font-size="16" font-weight="normal" font-family="Arial, sans-serif">Capture on a supervised, isolated training board. A qualified supervisor handles any powered verification.</text></svg>