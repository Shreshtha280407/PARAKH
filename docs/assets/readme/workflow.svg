<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc"><title id="title">PARAKH worker to assessor workflow</title><desc id="desc">Declare experience, explain the qualification match, capture task evidence, review and seal offline, then synchronize for human assessment and a verifiable signed report.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9844e"/></marker></defs><rect x="0" y="0" width="1400" height="790" rx="0" fill="#fbf6ec" stroke="#fbf6ec"/><text x="55" y="53" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">THE END-TO-END WORKFLOW</text><text x="55" y="107" fill="#482b1b" font-size="43" font-weight="normal" font-family="Georgia, serif">From prior experience to a verifiable recommendation.</text><text x="55" y="143" fill="#8c6c51" font-size="17" font-weight="normal" font-family="Arial, sans-serif">A worker-friendly capture flow, followed by a structured human assessment.</text><rect x="50" y="210" width="380" height="175" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="72" y="235" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">01</text><text x="72" y="261" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Declare experience</text><text x="72" y="287" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Choose a language, consent,</text><text x="72" y="311" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">set a local PIN and answer</text><text x="72" y="335" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">task and tool cards.</text><path d="M437 298 L499 298" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="510" y="210" width="380" height="175" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="532" y="235" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">02</text><text x="532" y="261" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Understand the match</text><text x="532" y="287" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">See the pilot QP fit,</text><text x="532" y="311" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">declared coverage, reasons</text><text x="532" y="335" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">and experience gaps.</text><path d="M897 298 L959 298" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="970" y="210" width="380" height="175" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="992" y="235" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">03</text><text x="992" y="261" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Capture evidence</text><text x="992" y="287" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Follow five task guides.</text><text x="992" y="311" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Record photos and videos</text><text x="992" y="335" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">on the isolated training board.</text><rect x="50" y="455" width="380" height="175" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="72" y="480" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">04</text><text x="72" y="506" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Review and seal</text><text x="72" y="532" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Optimize within the quota.</text><text x="72" y="556" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Hash, sign and encrypt</text><text x="72" y="580" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">the evidence package.</text><path d="M437 543 L499 543" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="510" y="455" width="380" height="175" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="532" y="480" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">05</text><text x="532" y="506" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Sync and assess</text><text x="532" y="532" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Resume uploads when online.</text><text x="532" y="556" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">An assessor reviews evidence</text><text x="532" y="580" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">and scores each criterion.</text><path d="M897 543 L959 543" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="970" y="455" width="380" height="175" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="992" y="480" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">06</text><text x="992" y="506" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Sign and verify</text><text x="992" y="532" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Confirm the recommendation.</text><text x="992" y="556" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Issue an immutable signed PDF</text><text x="992" y="580" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">and verify using its Report ID.</text><path d="M1160 390V422H240V448" fill="none" stroke="#b9844e" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/><rect x="50" y="686" width="1300" height="62" rx="16" fill="#e9eddf" stroke="#dfc9a9"/><text x="76" y="725" fill="#517765" font-size="14" font-weight="bold" font-family="Arial, sans-serif">01–04: WORKS OFFLINE</text><text x="550" y="725" fill="#517765" font-size="14" font-weight="bold" font-family="Arial, sans-serif">05–06: SERVER REACHABILITY REQUIRED</text></svg>