<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc"><title id="title">PARAKH system architecture</title><desc id="desc">The offline Android app seals evidence and later syncs to FastAPI. A durable worker processes private media. The dashboard supports human scoring and signed reports. PostgreSQL, private storage and a public verifier complete the system.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9844e"/></marker></defs><rect x="0" y="0" width="1400" height="1040" rx="0" fill="#fbf6ec" stroke="#fbf6ec"/><text x="55" y="53" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">SYSTEM ARCHITECTURE / IMPLEMENTED MVP</text><text x="55" y="107" fill="#482b1b" font-size="43" font-weight="normal" font-family="Georgia, serif">One evidence record. Three connected experiences.</text><text x="55" y="143" fill="#8c6c51" font-size="17" font-weight="normal" font-family="Arial, sans-serif">Capture stays on the phone until connectivity is available. The assessor owns the final recommendation.</text><rect x="50" y="180" width="1300" height="80" rx="16" fill="#f0e2cb" stroke="#dfc9a9"/><text x="75" y="212" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">PINNED QUALIFICATION PACK</text><text x="75" y="241" fill="#482b1b" font-size="20" font-weight="normal" font-family="Arial, sans-serif">CON/Q0602 v4.0  ·  tasks, criteria, support rubrics and versioned mapping rules</text><rect x="50" y="305" width="380" height="473" rx="16" fill="#f6ecdc" stroke="#dfc9a9"/><text x="72" y="338" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">01 / ANDROID · OFFLINE</text><rect x="510" y="305" width="380" height="473" rx="16" fill="#f6ecdc" stroke="#dfc9a9"/><text x="532" y="338" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">02 / FASTAPI · CONNECTED</text><rect x="970" y="305" width="380" height="473" rx="16" fill="#f6ecdc" stroke="#dfc9a9"/><text x="992" y="338" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">03 / DASHBOARD · HUMAN REVIEW</text><rect x="68" y="360" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="90" y="394" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Guided worker journey</text><text x="90" y="422" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Local PIN · English / Hindi</text><text x="90" y="446" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Structured declaration and explained match</text><rect x="68" y="492" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="90" y="526" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Capture and assistance</text><text x="90" y="554" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">CameraX photos / videos · Media3</text><text x="90" y="578" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Quality hints · sampled hand presence</text><rect x="68" y="624" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="90" y="658" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Protected local package</text><text x="90" y="686" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SQLCipher Room · durable outbox</text><text x="90" y="710" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SHA-256 · ECDSA · Tink encrypted vault</text><rect x="528" y="360" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="550" y="394" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Upload and integrity</text><text x="550" y="422" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Resumable chunks · hashes · quotas</text><text x="550" y="446" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Signed manifests · revision binding</text><rect x="528" y="492" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="550" y="526" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Assessment services</text><text x="550" y="554" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Lifecycle · human scores · profiles</text><text x="550" y="578" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Targeted revisions · immutable reports</text><rect x="528" y="624" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="550" y="658" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Durable background worker</text><text x="550" y="686" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Database-backed jobs and retry leases</text><text x="550" y="710" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">FFmpeg / ffprobe · media metadata</text><rect x="988" y="360" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="1010" y="394" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Inspect the evidence</text><text x="1010" y="422" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Protected gallery and video playback</text><text x="1010" y="446" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Task groups · shared 0–3 rubric anchors</text><rect x="988" y="492" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="1010" y="526" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Make the judgement</text><text x="1010" y="554" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Score · annotate · request recapture</text><text x="1010" y="578" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Computed profile supports the assessor</text><rect x="988" y="624" width="344" height="115" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="1010" y="658" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Confirm and sign</text><text x="1010" y="686" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Fresh password and explicit confirmation</text><text x="1010" y="710" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Ed25519 receipt over immutable PDF</text><path d="M432 460 L506 460" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="440" y="443" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">HTTPS</text><path d="M894 460 L965 460" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="904" y="443" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">API</text><rect x="50" y="822" width="380" height="116" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="72" y="856" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Versioned assessment data</text><text x="72" y="884" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">PostgreSQL in deployed environments</text><text x="72" y="908" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">SQLite used only in the README capture</text><rect x="510" y="822" width="380" height="116" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="532" y="856" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Private media and reports</text><text x="532" y="884" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Local volume for LAN / offline hosting</text><text x="532" y="908" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">S3-compatible storage for hosted services</text><rect x="970" y="822" width="380" height="116" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="992" y="856" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Public verification</text><text x="992" y="884" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Report ID / QR → authenticity + outcome</text><text x="992" y="908" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Local PDF + receipt → offline verifier</text><text x="55" y="980" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">DEPLOYMENT OPTIONS</text><text x="55" y="1010" fill="#8c6c51" font-size="16" font-weight="normal" font-family="Arial, sans-serif">Local / LAN: Docker Compose   ·   Hosted topology: Vercel dashboard + Railway API / worker + Neon data / storage</text></svg>