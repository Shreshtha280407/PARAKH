<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Task-specific reassessment</title><desc id="desc">Only the requested task is reopened and recaptured. The new revision inherits unchanged tasks by reference and preserves the request reason and evidence history.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9844e"/></marker></defs><rect x="0" y="0" width="1400" height="620" rx="0" fill="#fbf6ec" stroke="#fbf6ec"/><text x="55" y="53" fill="#b9844e" font-size="12" font-weight="bold" font-family="Arial, sans-serif">TARGETED REASSESSMENT</text><text x="55" y="107" fill="#482b1b" font-size="43" font-weight="normal" font-family="Georgia, serif">Ask for the missing proof. Keep the rest.</text><text x="55" y="143" fill="#8c6c51" font-size="17" font-weight="normal" font-family="Arial, sans-serif">A new revision preserves the relationship between original evidence and the requested recapture.</text><rect x="50" y="215" width="380" height="195" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="72" y="240" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">01 / REVIEW</text><text x="72" y="266" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Assessor requests T2</text><text x="72" y="292" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">A reason is required.</text><text x="72" y="316" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Capture instructions explain</text><text x="72" y="340" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">which detail must be visible.</text><rect x="510" y="215" width="380" height="195" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="532" y="240" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">02 / RECAPTURE</text><text x="532" y="266" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Worker recaptures T2</text><text x="532" y="292" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">The phone unlocks the requested task.</text><text x="532" y="316" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Other tasks keep their prior evidence.</text><text x="532" y="340" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">A new package records the revision.</text><rect x="970" y="215" width="380" height="195" rx="16" fill="#fffdfa" stroke="#dfc9a9"/><text x="992" y="240" fill="#b9844e" font-size="11" font-weight="bold" font-family="Arial, sans-serif">03 / RESUBMIT</text><text x="992" y="266" fill="#482b1b" font-size="21" font-weight="bold" font-family="Arial, sans-serif">Review the new revision</text><text x="992" y="292" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Upload only the replacement evidence.</text><text x="992" y="316" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Inherit unchanged tasks by reference.</text><text x="992" y="340" fill="#8c6c51" font-size="15" font-weight="normal" font-family="Arial, sans-serif">Keep requests and history auditable.</text><path d="M435 308 L502 308" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M895 308 L963 308" stroke="#b9844e" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="74" y="478" width="220" height="90" rx="16" fill="#f0e3cd" stroke="#dfc9a9"/><text x="96" y="513" fill="#482b1b" font-size="17" font-weight="bold" font-family="Arial, sans-serif">T1</text><text x="96" y="545" fill="#8c6c51" font-size="14" font-weight="normal" font-family="Arial, sans-serif">Inherited by reference</text><rect x="324" y="478" width="220" height="90" rx="16" fill="#dbe7da" stroke="#dfc9a9"/><text x="346" y="513" fill="#517765" font-size="17" font-weight="bold" font-family="Arial, sans-serif">T2</text><text x="346" y="545" fill="#8c6c51" font-size="14" font-weight="normal" font-family="Arial, sans-serif">New evidence</text><rect x="574" y="478" width="220" height="90" rx="16" fill="#f0e3cd" stroke="#dfc9a9"/><text x="596" y="513" fill="#482b1b" font-size="17" font-weight="bold" font-family="Arial, sans-serif">T3</text><text x="596" y="545" fill="#8c6c51" font-size="14" font-weight="normal" font-family="Arial, sans-serif">Inherited by reference</text><rect x="824" y="478" width="220" height="90" rx="16" fill="#f0e3cd" stroke="#dfc9a9"/><text x="846" y="513" fill="#482b1b" font-size="17" font-weight="bold" font-family="Arial, sans-serif">T4</text><text x="846" y="545" fill="#8c6c51" font-size="14" font-weight="normal" font-family="Arial, sans-serif">Inherited by reference</text><rect x="1074" y="478" width="220" height="90" rx="16" fill="#f0e3cd" stroke="#dfc9a9"/><text x="1096" y="513" fill="#482b1b" font-size="17" font-weight="bold" font-family="Arial, sans-serif">T5</text><text x="1096" y="545" fill="#8c6c51" font-size="14" font-weight="normal" font-family="Arial, sans-serif">Inherited by reference</text></svg>