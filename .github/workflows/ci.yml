name: CI

on:
  push:
    branches:
      - main
      - nipun
      - "codex/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-pack-validate:
    name: P1 pack validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnostic context
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
      - name: Verify pinned QP PDF hash
        run: |
          echo "27ef7dc3dfdcaad536bee7c1ebd73fcf7cb381e570f009cbb1b39f1060e514ad  packs/ae-con-q0602/qp_v4.0.pdf" | sha256sum -c -
      - name: Validate the CON/Q0602 pack
        run: python tools/pack_validate.py packs/ae-con-q0602
      - name: Audit QP source traceability
        run: python tools/audit_qp_traceability.py packs/ae-con-q0602
      - name: Android EN/HI string parity and declaration-contract drift check
        run: python tools/check_android_string_parity.py
      - name: Negative fixtures must fail their one targeted check
        run: |
          expect_fail() { if "$@"; then echo "ERROR: expected this to fail but it exited 0: $*"; exit 1; fi; }
          expect_fail python tools/pack_validate.py tests/fixtures/pack_121mb
          expect_fail python tools/pack_validate.py tests/fixtures/pack_missing_pc_task
          expect_fail python tools/audit_qp_traceability.py tests/fixtures/pack_missing_pc_task
          expect_fail python tools/audit_qp_traceability.py tests/fixtures/pack_wrong_qp_version
          expect_fail python tools/audit_qp_traceability.py tests/fixtures/pack_unknown_pc_ref
      - name: Matcher self-check and golden-vector parity
        run: |
          python ml/mapping/test_matcher.py
          python ml/mapping/test_golden_vectors.py
      - name: Matcher eval in harness mode
        run: python ml/mapping/eval.py --rules packs/ae-con-q0602/mapping --set ml/mapping/data/labelled_60.jsonl
      - name: Harness data must refuse field-validation mode
        run: |
          expect_fail() { if "$@"; then echo "ERROR: expected this to fail but it exited 0: $*"; exit 1; fi; }
          expect_fail python ml/mapping/eval.py --rules packs/ae-con-q0602/mapping --set ml/mapping/data/labelled_60.jsonl --mode field

  p2-backend-tests:
    name: Backend tests (P2/P2.1/P2.2/P6) + OpenAPI freshness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parakh
          POSTGRES_PASSWORD: parakh_test_pw
          POSTGRES_DB: parakh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parakh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://parakh:parakh_test_pw@localhost:5432/parakh_test
      # P7: REPORT_SIGNING_PRIVATE_KEY is now required in every environment
      # (config.py no longer auto-generates a fresh key per process restart,
      # even in development -- see docs/gates/P7.md section 4). A fixed
      # CI-only test key, never used anywhere real.
      REPORT_SIGNING_PRIVATE_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg for real video-thumbnail tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r server/requirements.txt
      - name: Run backend tests against real PostgreSQL
        run: python -m pytest server/tests -v
      - name: OpenAPI contract must be up to date
        run: python tools/export_openapi.py --check

  android-core-mapping-tests:
    name: Q-1/P-3 Kotlin matcher parity (core:mapping)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Golden-vector parity, Kotlin vs Python (100/100)
        working-directory: apps/android
        run: ./gradlew :core:mapping:test --tests "*GoldenVectorsTest*" --tests "*MatcherTest*" --console=plain
      - name: Upload core:mapping test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-mapping-test-report
          path: apps/android/core/mapping/build/reports/tests/test
          if-no-files-found: ignore

  android-app-build:
    name: P3/P4/P5/P6 + Q2/Q3 Android tests and debug/release builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install current Android SDK components
        # Do not use android-actions/setup-android@v3 here: its default
        # package list contains the obsolete SDK package named "tools", which
        # current sdkmanager correctly rejects. GitHub-hosted Ubuntu runners
        # already include Android command-line tools; install only supported,
        # explicit packages needed by this project.
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"
      # P5: core:budget (pure Kotlin/JVM, including the 500-op randomized ledger invariant
      # test), media and core:seal (real JPEG encode/decode and real Tink crypto run fine on
      # a GitHub-hosted runner -- only real camera/CameraX/MediaCodec/AndroidKeyStore need a
      # physical device, exercised locally/physically, not here) unit tests, plus the app
      # module's own unit tests (P4's EvidenceRepository/EvidenceFileManager, P5's
      # SealOrchestrator) -- previously only core:mapping's matcher tests ran in CI; this was
      # a real gap P5 closes, not something newly introduced by P5 itself.
      - name: Unit tests (core:budget, media, core:seal, app)
        working-directory: apps/android
        run: ./gradlew :core:budget:test :media:testDebugUnitTest :core:seal:testDebugUnitTest :app:testDebugUnitTest --console=plain
      - name: Static Kotlin checks (lint, all modules)
        working-directory: apps/android
        run: ./gradlew lint --console=plain
      - name: Assemble debug and release APKs
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      # P4/P5/P6 debug-only-feature-absent-from-release proofs, and P6's network-permission/
      # cleartext-policy proofs (P6 flips the OLD "no network at all" policy to "exactly
      # INTERNET+ACCESS_NETWORK_STATE, nothing else, and release forbids cleartext") -- see
      # each task's own doc comment in app/build.gradle.kts for exactly what each checks.
      - name: Verify debug-only test features never reach release, and P6 network/cleartext policy
        working-directory: apps/android
        run: |
          ./gradlew \
            :app:verifyP4TestCeilingDisabledInRelease \
            :app:verifyP5DebugFeaturesDisabledInRelease \
            :app:verifyP5DebugExportAbsentFromRelease \
            :app:verifyP6TestOnlySyncOverrideDisabledInRelease \
            :app:verifyP6SyncEndpointOverrideAbsentFromRelease \
            :app:verifyNoGalleryImportPath \
            :app:verifyExpectedNetworkPermissions \
            :app:verifyMergedManifestHasExpectedNetworkPermissions \
            :app:verifyReleaseForbidsCleartextTraffic \
            --console=plain
      # P6 instrumented tests (SyncRepositoryInstrumentedTest, AppDatabaseMigrationTest) need a
      # real device/AndroidKeyStore and so are NOT run here (see the real-device-only note
      # below) -- but the androidTest source set itself must still compile cleanly in CI, the
      # same bar every other source set in this build is held to.
      - name: Compile instrumented test sources (compile-only check; real run needs a device)
        working-directory: apps/android
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaushalpramaan-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      # Assistance uses synthetic fixtures and public model assets; never private Drive media.
      # Frozen proxy metadata/threshold checks do not assert independent field performance.
      - name: Assistance intake, protocol and reproducible privacy-safe fixture checks
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 -m unittest discover -s ml/assistance -v
          python3 ml/quality/generate_vectors.py --check
          python3 tools/verify_assistance_assets.py --require-calibrated
      # This committed Android export predates the current v3 quality calibration and
      # the v0.1 MediaPipe detection-confidence change. Replay it ONLY against its
      # original, immutable v2 quality thresholds and v1 hands manifest. Keep strict
      # hash/parity checks enabled; never reinterpret old output using new assets.
      # Separately verify the current shipped assets and Kotlin builds below.
      - name: Replay historical Android scalar outputs against matching frozen profiles
        run: |
          python3 ml/quality/eval.py --protocol ml/quality/data/splits.json --partition proxy \
            --thresholds ml/quality/calibration/quality-proxy-v2.json \
            --android-results ml/assistance/reports/oneplus13r-functional-final-results.jsonl --out /tmp/quality-ci-replay.json
          python3 ml/hands/eval.py --protocol ml/hands/data/splits.json --partition proxy \
            --model-manifest ml/hands/calibration/hands-proxy-v1-model.json \
            --android-results ml/assistance/reports/oneplus13r-functional-final-results.jsonl --out /tmp/hands-ci-replay.json
      - name: Q2/Q3 unit parity, builds, instrumentation compilation and offline harness permissions
        working-directory: apps/android
        run: |
          ./gradlew :assist-quality:testDebugUnitTest :assist-hands:testDebugUnitTest \
            :assist-quality:bundleReleaseAar :assist-hands:bundleReleaseAar \
            :assist-benchmark:assembleDebug :assist-benchmark:assembleRelease \
            :assist-benchmark:assembleDebugAndroidTest :assist-benchmark:verifyOfflineHarnessManifest --console=plain
      - name: Assistance model/profile assets available identically in debug and release
        run: |
          python3 tools/verify_assistance_assets.py --require-calibrated \
            --apk apps/android/assist-benchmark/build/outputs/apk/debug/assist-benchmark-debug.apk \
            --apk apps/android/assist-benchmark/build/outputs/apk/release/assist-benchmark-release-unsigned.apk
    # Real-device-only coverage (CameraX capture, Media3 Transformer video transcoding, real
    # AndroidKeyStore ECDSA signing, real Tink StreamingAead vault encryption, SQLCipher's
    # native library, and P6's real-Keystore-backed sync tests) is NOT run on GitHub-hosted
    # runners -- nested KVM virtualization for an Android emulator is unavailable/unreliable
    # there, and several of these primitives (AndroidKeyStore in particular) do not exist in
    # any emulator either, only real hardware. This is a platform constraint, not an
    # incomplete P3/P4/P5/P6 feature: the instrumented tests exist (apps/android/app/src/
    # androidTest, apps/android/media/src/androidTest, apps/android/core/seal/src/androidTest)
    # and the commands below reproduce them exactly, run locally against a real physical
    # device.
    #
    #   cd apps/android && ./gradlew :app:connectedDebugAndroidTest --console=plain
    #   cd apps/android && ./gradlew :media:connectedDebugAndroidTest --console=plain
    #   cd apps/android && ./gradlew :core:seal:connectedDebugAndroidTest --console=plain
    #
    # See docs/gates/P3.md, docs/gates/P4.md, docs/gates/P5.md, and docs/gates/P6.md for the
    # actual run transcripts -- P3 against an emulator (KaushalPramaan_API35), P4/P5/P6 against
    # a real OnePlus 13R (physical AndroidKeyStore/CameraX/MediaCodec hardware is required).

  dashboard-build:
    name: Dashboard build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Build (tsc -b && vite build -- fails on type errors)
        working-directory: apps/dashboard
        run: npm run build

  docker-compose-smoke-test:
    name: Docker Compose end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [p1-pack-validate, p2-backend-tests, dashboard-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for the stack
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          DATABASE_URL=postgresql+psycopg://parakh:parakh_dev_pw@db:5432/parakh
          JWT_SECRET=ci-smoke-test-secret-not-for-real-use
          JWT_ALGORITHM=HS256
          JWT_ISSUER=kaushalpramaan
          JWT_AUDIENCE=kaushalpramaan-dashboard
          JWT_EXPIRE_MINUTES=60
          WORKER_TOKEN_BYTES=32
          EVIDENCE_DIR=/data/evidence
          UPLOAD_SESSION_TTL_MINUTES=120
          UPLOAD_CHUNK_MAX_BYTES=2097152
          JOB_POLL_INTERVAL_SECONDS=2.0
          JOB_MAX_ATTEMPTS=3
          JOB_LEASE_SECONDS=300
          DEV_ASSESSOR_EMAIL=assessor.demo@parakh.test
          DEV_ASSESSOR_PASSWORD=ci-smoke-test-pw
          REPORT_SIGNING_PRIVATE_KEY=c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
          REPORT_SIGNING_KEY_ID=ci-smoke-test-key
          CORS_ALLOW_ORIGINS=http://localhost:5173
          POSTGRES_USER=parakh
          POSTGRES_PASSWORD=parakh_dev_pw
          POSTGRES_DB=parakh
          DASHBOARD_API_BASE_URL=http://localhost:8000
          EOF
      - name: Build and start the stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for api + dashboard to report healthy
        run: |
          for i in $(seq 1 60); do
            api_status=$(docker inspect --format '{{.State.Health.Status}}' kaushalpramaan-mvp-api-1 2>/dev/null || echo "starting")
            dash_status=$(docker inspect --format '{{.State.Health.Status}}' kaushalpramaan-mvp-dashboard-1 2>/dev/null || echo "starting")
            echo "attempt $i: api=$api_status dashboard=$dash_status"
            if [ "$api_status" = "healthy" ] && [ "$dash_status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy in time"
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - name: Seed demo data
        run: docker compose -f infra/docker-compose.yml exec -T api python -m app.seed
      - name: Login as seeded assessor and verify the protected queue
        run: |
          set -e
          TOKEN=$(curl -sf -X POST http://localhost:8000/auth/login -H "Content-Type: application/json" \
            -d '{"email":"assessor.demo@parakh.test","password":"ci-smoke-test-pw"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          test -n "$TOKEN"
          curl -sf http://localhost:8000/queue -H "Authorization: Bearer $TOKEN" > queue.json
          python3 -c "import json; d=json.load(open('queue.json')); assert isinstance(d, list); print(f'{len(d)} queue items ok')"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/queue)
          test "$code" = "401"
          echo "unauthenticated request correctly rejected (401)"
      - name: Full P2.2 lifecycle end-to-end (create -> upload -> submit -> review -> score -> recommend -> signed report -> verify -> reassess -> token rotate/revoke)
        run: |
          python3 tools/docker_e2e_smoke.py --base-url http://localhost:8000 \
            --assessor-email assessor.demo@parakh.test --assessor-password ci-smoke-test-pw
      - name: Full P6 lifecycle end-to-end (register worker -> resolve pack -> signed manifest -> chunked evidence upload -> integrity rejection -> submit gate -> sync-status -> protected review -> audit log)
        run: |
          python3 -m pip install --quiet cryptography
          python3 tools/docker_e2e_smoke_p6.py --base-url http://localhost:8000 \
            --assessor-email assessor.demo@parakh.test --assessor-password ci-smoke-test-pw
      - name: Dashboard is reachable
        run: curl -sf -o /dev/null http://localhost:5173/
      - name: Shut down cleanly
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
