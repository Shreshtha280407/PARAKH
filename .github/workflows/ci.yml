name: CI

on:
  push:
    branches:
      - main
      - nipun
      - "codex/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-pack-validate:
    name: P1 pack validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnostic context
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "ref=$GITHUB_REF"
          echo "sha=$GITHUB_SHA"
      - name: Verify pinned QP PDF hash
        run: |
          echo "27ef7dc3dfdcaad536bee7c1ebd73fcf7cb381e570f009cbb1b39f1060e514ad  packs/ae-con-q0602/qp_v4.0.pdf" | sha256sum -c -
      - name: Validate the CON/Q0602 pack
        run: python tools/pack_validate.py packs/ae-con-q0602
      - name: Audit QP source traceability
        run: python tools/audit_qp_traceability.py packs/ae-con-q0602
      - name: Negative fixtures must fail their one targeted check
        run: |
          expect_fail() { if "$@"; then echo "ERROR: expected this to fail but it exited 0: $*"; exit 1; fi; }
          expect_fail python tools/pack_validate.py tests/fixtures/pack_121mb
          expect_fail python tools/pack_validate.py tests/fixtures/pack_missing_pc_task
          expect_fail python tools/audit_qp_traceability.py tests/fixtures/pack_missing_pc_task
          expect_fail python tools/audit_qp_traceability.py tests/fixtures/pack_wrong_qp_version
          expect_fail python tools/audit_qp_traceability.py tests/fixtures/pack_unknown_pc_ref
      - name: Matcher self-check and golden-vector parity
        run: |
          python ml/mapping/test_matcher.py
          python ml/mapping/test_golden_vectors.py
      - name: Matcher eval in harness mode
        run: python ml/mapping/eval.py --rules packs/ae-con-q0602/mapping --set ml/mapping/data/labelled_60.jsonl
      - name: Harness data must refuse field-validation mode
        run: |
          expect_fail() { if "$@"; then echo "ERROR: expected this to fail but it exited 0: $*"; exit 1; fi; }
          expect_fail python ml/mapping/eval.py --rules packs/ae-con-q0602/mapping --set ml/mapping/data/labelled_60.jsonl --mode field

  p2-backend-tests:
    name: P2/P2.1 backend tests + OpenAPI freshness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parakh
          POSTGRES_PASSWORD: parakh_test_pw
          POSTGRES_DB: parakh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parakh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://parakh:parakh_test_pw@localhost:5432/parakh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r server/requirements.txt
      - name: Run backend tests against real PostgreSQL
        run: python -m pytest server/tests -v
      - name: OpenAPI contract must be up to date
        run: python tools/export_openapi.py --check

  dashboard-build:
    name: Dashboard build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Build (tsc -b && vite build -- fails on type errors)
        working-directory: apps/dashboard
        run: npm run build

  docker-compose-smoke-test:
    name: Docker Compose end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [p1-pack-validate, p2-backend-tests, dashboard-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for the stack
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+psycopg://parakh:parakh_dev_pw@db:5432/parakh
          JWT_SECRET=ci-smoke-test-secret-not-for-real-use
          JWT_ALGORITHM=HS256
          JWT_ISSUER=kaushalpramaan
          JWT_AUDIENCE=kaushalpramaan-dashboard
          JWT_EXPIRE_MINUTES=60
          WORKER_TOKEN_BYTES=32
          EVIDENCE_DIR=/data/evidence
          UPLOAD_SESSION_TTL_MINUTES=120
          UPLOAD_CHUNK_MAX_BYTES=2097152
          JOB_POLL_INTERVAL_SECONDS=2.0
          JOB_MAX_ATTEMPTS=3
          DEV_ASSESSOR_EMAIL=assessor.demo@parakh.test
          DEV_ASSESSOR_PASSWORD=ci-smoke-test-pw
          POSTGRES_USER=parakh
          POSTGRES_PASSWORD=parakh_dev_pw
          POSTGRES_DB=parakh
          DASHBOARD_API_BASE_URL=http://localhost:8000
          EOF
      - name: Build and start the stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for api + dashboard to report healthy
        run: |
          for i in $(seq 1 60); do
            api_status=$(docker inspect --format '{{.State.Health.Status}}' kaushalpramaan-mvp-api-1 2>/dev/null || echo "starting")
            dash_status=$(docker inspect --format '{{.State.Health.Status}}' kaushalpramaan-mvp-dashboard-1 2>/dev/null || echo "starting")
            echo "attempt $i: api=$api_status dashboard=$dash_status"
            if [ "$api_status" = "healthy" ] && [ "$dash_status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy in time"
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - name: Seed demo data
        run: docker compose -f infra/docker-compose.yml exec -T api python -m app.seed
      - name: Login as seeded assessor and verify the protected queue
        run: |
          set -e
          TOKEN=$(curl -sf -X POST http://localhost:8000/auth/login -H "Content-Type: application/json" \
            -d '{"email":"assessor.demo@parakh.test","password":"ci-smoke-test-pw"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          test -n "$TOKEN"
          curl -sf http://localhost:8000/queue -H "Authorization: Bearer $TOKEN" > queue.json
          python3 -c "import json; d=json.load(open('queue.json')); assert isinstance(d, list); print(f'{len(d)} queue items ok')"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/queue)
          test "$code" = "401"
          echo "unauthenticated request correctly rejected (401)"
      - name: Upload a small evidence fixture and verify the SHA-256 receipt
        run: |
          set -e
          TOKEN=$(curl -sf -X POST http://localhost:8000/auth/login -H "Content-Type: application/json" \
            -d '{"email":"assessor.demo@parakh.test","password":"ci-smoke-test-pw"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          CREATED=$(curl -sf -X POST http://localhost:8000/assessments -H "Content-Type: application/json" -d '{"worker_id": 2, "pack_id": 1}')
          AID=$(echo "$CREATED" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          WT=$(echo "$CREATED" | python3 -c "import sys,json;print(json.load(sys.stdin)['worker_token'])")
          head -c 65536 /dev/urandom > fixture.jpg
          SHA=$(sha256sum fixture.jpg | cut -d' ' -f1)
          SESSION=$(curl -sf -X POST http://localhost:8000/uploads -H "Content-Type: application/json" -H "X-Worker-Token: $WT" \
            -d "{\"assessment_id\": $AID, \"task_code\": \"T1\", \"kind\": \"photo\", \"mime\": \"image/jpeg\", \"claimed_size_bytes\": 65536}")
          SID=$(echo "$SESSION" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -sf -X PUT "http://localhost:8000/uploads/$SID/chunks/0" -H "X-Worker-Token: $WT" --data-binary @fixture.jpg > /dev/null
          RECEIPT=$(curl -sf -X POST "http://localhost:8000/uploads/$SID/complete" -H "Content-Type: application/json" -H "X-Worker-Token: $WT" \
            -d "{\"client_sha256\": \"$SHA\"}")
          echo "$RECEIPT"
          RECEIPT_SHA=$(echo "$RECEIPT" | python3 -c "import sys,json;print(json.load(sys.stdin)['sha256'])")
          test "$RECEIPT_SHA" = "$SHA"
          echo "receipt sha256 matches the real file hash"
      - name: Dashboard is reachable
        run: curl -sf -o /dev/null http://localhost:5173/
      - name: Shut down cleanly
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
